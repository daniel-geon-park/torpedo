[project]
name = "torpedo"
version = "0.1.0"
description = "Persistent HTTP monitor for Tenstorrent devices"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.scripts]
torpedo = "torpedo.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
